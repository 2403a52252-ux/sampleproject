
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .login {
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 30px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <br><br>

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
